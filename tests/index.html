<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QueryForm local example</title>
</head>
<body>
  <h1>QueryForm local example</h1>
  <p><a href="?utm_source=newsletter&utm_campaign=launch">Capture example campaign</a></p>
  <p><a href="./index.html">Visit without URL parameters</a> to check persistence.</p>
  <form>
    <label>Source <input name="utm_source" class="qf_utm_source" readonly></label>
    <label>Campaign <input name="utm_campaign" class="qf_utm_campaign" readonly></label>
    <button>Show submission</button>
  </form>
  <button id="clear" type="button">Clear stored attribution</button>
  <pre id="output" aria-live="polite"></pre>
  <script type="module">
    import QueryForm from '../src/queryform.js';
    const qf = new QueryForm();
    await qf.init({ local: true }, [
      { param: 'utm_source', class_name: 'qf_utm_source' },
      { param: 'utm_campaign', class_name: 'qf_utm_campaign' },
    ]);
    document.querySelector('form').addEventListener('submit', event => {
      event.preventDefault();
      document.querySelector('#output').textContent = JSON.stringify(Object.fromEntries(new FormData(event.target)), null, 2);
    });
    document.querySelector('#clear').addEventListener('click', () => {
      qf.clear();
      document.querySelector('form').reset();
      document.querySelector('#output').textContent = 'Stored attribution cleared. The current URL can be captured again by initialization or refresh.';
    });
  </script>
</body>
</html>
